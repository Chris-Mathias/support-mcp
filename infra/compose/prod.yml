services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB:       ${POSTGRES_DB:-support_mvp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV:               production
      DATABASE_URL:           postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-support_mvp}
      LLM_API_KEY:            ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_MODEL:              ${LLM_MODEL:?LLM_MODEL is required}
      LLM_TITLE_MODEL:        ${LLM_TITLE_MODEL}
      ENCRYPTION_KEY:         ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      SESSION_SECRET:         ${SESSION_SECRET:?SESSION_SECRET is required}
      APP_PASSWORD:           ${APP_PASSWORD:?APP_PASSWORD is required}
      UPLOADS_DIR:            /uploads
      ALLOWED_ORIGINS:        ${ALLOWED_ORIGINS:-http://localhost}
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-30}
      RATE_LIMIT_GLOBAL:      ${RATE_LIMIT_GLOBAL:-60}
      RATE_LIMIT_LLM:         ${RATE_LIMIT_LLM:-15}
      RATE_LIMIT_UPLOAD:      ${RATE_LIMIT_UPLOAD:-5}
      RATE_LIMIT_WINDOW:      ${RATE_LIMIT_WINDOW:-1m}
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:
